<!doctype html>
<!-- read PackageCtrl.js — how opkg is invoked on this build. -->
<html><head><meta charset="utf-8"><title>pkgctrl</title></head>
<body><pre id="out">reading…</pre><script>
(function () {
  "use strict";
  var out = document.getElementById("out");
  var report = { started: new Date().toISOString(), files: {} };
  function save(tag) {
    try {
      var x = new XMLHttpRequest();
      x.open("POST", "/api/recon", true);
      x.setRequestHeader("Content-Type", "application/json");
      x.send(JSON.stringify({ tag: tag, at: new Date().toISOString(), report: report }));
    } catch (e) {}
  }
  function raw(path) {
    try {
      var r = HiUtils_createRequest("fileRead", { path: path, mode: 6 });
      var msg = r.msg;
      if (msg != null && typeof msg === "object") msg = JSON.stringify(msg);
      return { ret: r.ret, msg: String(msg == null ? "" : msg).slice(0, 22000) };
    } catch (e) { return { exception: String(e) }; }
  }
  var S = "../APPS/pkgs/tv.vidaa.jsservice.system/current/services/pkgmgr/";
  setTimeout(function () {
    report.files.pc = raw(S + "PackageCtrl.js");
    save("pc0");
    setTimeout(function () { save("pc-end"); try { out.textContent = JSON.stringify(report, null, 1); } catch (e) {} }, 2000);
  }, 2000);
})();
</script></body></html>
